name: E2E install

on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 1'

permissions:
  contents: read

jobs:
  install-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install the panel with the real installer
        run: sudo bash install.sh
      - name: Deploy, redeploy and rescale an image service
        run: ./scripts/smoke-install.sh
      - name: Collect logs on failure
        if: failure()
        run: |
          sudo cat /var/log/berth-install.log || true
          docker ps -a || true
          sudo journalctl -u berth-agent --no-pager -n 200 || true
