name: CI

on:
  pull_request:
  push:
    branches: [production]

jobs:
  panel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @berth/server prisma:generate
      - run: pnpm --filter @berth/protocol build
      - run: pnpm type-check
      - run: pnpm test
      - run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @berth/protocol build
      - run: pnpm --filter @berth/ui exec playwright install --with-deps chromium
      - run: pnpm --filter @berth/ui test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/berth-ui/playwright-report

  agent:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/berth-agent
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/berth-agent
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
