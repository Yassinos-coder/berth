name: GitHub Pages

on:
  push:
    branches: [production]
    paths:
      - 'docs/**'
      - 'apps/berth-docs/**'
      - 'install.sh'
      - 'apps/berth-agent/install.sh'
      - 'SECURITY.md'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build docs site
        run: bun run docs:build

      - name: Publish installer scripts
        run: |
          bash -n install.sh
          bash -n apps/berth-agent/install.sh
          cp install.sh apps/berth-docs/dist/install.sh
          cp apps/berth-agent/install.sh apps/berth-docs/dist/agent-install.sh
          touch apps/berth-docs/dist/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/berth-docs/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
