map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Panel API — same origin as the UI so the session cookie stays first-party.
  # Upgrade/Connection headers are forwarded so WebSocket routes (agent-facing
  # channels and the browser exec terminal) survive this proxy hop.
  location /api/ {
    proxy_pass http://server:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 3600s;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(js|css|svg|woff2?)$ {
    expires 7d;
    add_header Cache-Control "public, immutable";
  }
}
